# npm 发布：**手动触发**（邓总拍板：不做自动发布）。
#
# 发版流程（详见 docs/RELEASE.md）：
#   1. 本地改好 package.json version + 更新 CHANGELOG（手动维护）
#   2. 打 tag 推送（如 v0.10.0）
#   3. GitHub 仓库 → Actions → npm publish → Run workflow → 填 tag
#
# 鉴权方式：npm Trusted Publishing（OIDC），零 token——npmjs.com 上配置
# LiteChipCloud/litegate + workflow 文件名 npm-publish.yml 后，
# npm(>=11.5.1) 用 OIDC 证明发布来源，无需 NPM_TOKEN secret。
# permissions.id-token: write 是 provenance 与 OIDC 的硬性要求。

name: npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.10.0，须已在远程存在）'
        required: true
        type: string

permissions:
  contents: read # checkout 源码
  id-token: write # npm provenance + OIDC trusted publishing 必需

concurrency:
  group: npm-publish
  cancel-in-progress: false # 排队发布，不互杀（避免并发 publish 冲突）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（对齐发布 tag）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # 缓存 ~/.npm，key 由 package-lock.json 派生
          registry-url: 'https://registry.npmjs.org'

      # Node 22 自带 npm 10.x，不支持 OIDC trusted publishing（最低 11.5.1），
      # 不升级会在 publish 鉴权时报 403/404
      - name: 升级 npm（>=11.5.1，trusted publishing 要求）
        run: npm install -g npm@latest

      # package-lock 的 resolved 记录公司内网 Nexus（本机 .npmrc 所配），
      # runner DNS 解析不了——重写 host 为官方源（内网 Nexus 是 npmjs 代理镜像，哈希不变）
      - name: 重写 lockfile 为官方 registry
        run: node -e 'const fs=require("fs");const p="package-lock.json";fs.writeFileSync(p,fs.readFileSync(p,"utf8").split("http://gitlab.lcc.local:8081/repository/lcc-npm-public").join("https://registry.npmjs.org"))'

      - name: 安装依赖
        run: npm ci

      # tsc 产物检查先行失败；完整门禁（build+test）在下一步 publish 的
      # prepublishOnly 钩子里还会再跑一遍（package.json: prepublishOnly）
      - name: 构建
        run: npm run build

      # 不设 NODE_AUTH_TOKEN：npm >=11.5.1 走 OIDC trusted publishing；
      # --provenance 生成构建来源证明（npmjs.com 徽标 + 可验证性）
      - name: 发布到 npm
        run: npm publish --provenance
