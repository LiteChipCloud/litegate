name: Test

# 三平台矩阵（含真实 Windows runner）：单测 + E2E 冒烟。
# E2E 在线层依赖真实网关，不可达时 skipIf 自动降级（离线层恒跑）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # package-lock 的 resolved 记录公司内网 Nexus（本机 .npmrc 所配），runner DNS 解析不了。
      # config set registry 不影响 lock 已有 resolved（实测）→ 直接重写 host；
      # 内网 Nexus 是 npmjs 代理镜像，路径与官方一一对应，integrity 哈希不变。
      # 用 node 而非 sed：三平台 runner 通用（windows 默认 pwsh 无 sed）。
      - name: 重写 lockfile 为官方 registry
        run: node -e 'const fs=require("fs");const p="package-lock.json";fs.writeFileSync(p,fs.readFileSync(p,"utf8").split("http://gitlab.lcc.local:8081/repository/lcc-npm-public").join("https://registry.npmjs.org"))'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
