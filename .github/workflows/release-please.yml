# release-please 自动化发版：conventional commits -> Release PR -> GitHub Release + tag
#
# 工作方式（manifest 模式）：
#   - 推送到 main 后，扫描 conventional commits（feat/fix/chore(deps) 等），
#     自动开/更新一个 "chore(main): release X.Y.Z" 的 Release PR（版本号 + CHANGELOG.md）。
#   - 邓总合并该 PR 后，本 action 创建 GitHub Release + tag（vX.Y.Z），
#     并把新版本写回 .release-please-manifest.json。
#   - tag / Release 创建成功后，触发 .github/workflows/npm-publish.yml 发布 npm。
#
# 注意（GitHub 平台限制）：若 token 用默认 GITHUB_TOKEN，其创建的 Release/PR
# 不会触发其他 workflow（npm-publish 不会跑）。配置 secret RELEASE_PLEASE_TOKEN
# （PAT）即可打通全自动链条；未配置时 release-please 本身仍正常工作，
# 可用 npm-publish.yml 的 workflow_dispatch 手动补救。详见 docs/RELEASE.md。

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write # 写 CHANGELOG / package.json / 创建 tag 与 GitHub Release
  pull-requests: write # 创建与更新 Release PR

concurrency:
  group: release-please
  cancel-in-progress: false # 同一时间只处理一个 Release PR，排队不互杀

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 优先用 PAT（能触发下游 workflow）；没有则退回 GITHUB_TOKEN（仅 release-please 自身可用）
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # 不设 release-type 输入 => 走 manifest 模式，读取下面两个文件（路径即 v4 默认值，写显式便于检索）
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
